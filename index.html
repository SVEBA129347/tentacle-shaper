<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tentacle Shaper</title>
<meta name="description" content="Open board CAD/CAM for surf and wake-surf boards. Reads Shape3D X .s3dx files.">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="design">
<header class="bar">
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 19c4 0 6-3 6-7s2-7 6-7c2.5 0 4 1.6 4 3.6 0 1.8-1.3 3-3 3-1.5 0-2.5-1-2.5-2.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg> Tentacle Shaper</div>
  <button id="openBtn" class="primary" data-i18n="open">Открыть .s3dx</button>
  <input id="file" type="file" accept=".s3dx" hidden>
  <nav class="tabs">
    <button class="tab on" data-tab="design" data-i18n="design">Проектирование</button>
    <button class="tab" data-tab="3d" data-i18n="view3d">3D</button>
  </nav>
  <div class="spacer"></div>
  <span id="msg" class="msg"></span>
  <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</header>

<main>
  <section class="empty">
    <div class="dropbox">
      <div class="big-ico">⇪</div>
      <p data-i18n="drop">Перетащите файл доски .s3dx сюда или нажмите «Открыть .s3dx».</p>
      <p class="note" data-i18n="dropNote">Файл открывается только у вас в браузере и никуда не отправляется.</p>
    </div>
  </section>

  <section class="work">
    <div class="views design-only">
      <div class="pane top"><div class="ptitle" data-i18n="top">Вид сверху</div><canvas id="cTop"></canvas></div>
      <div class="pane slice"><div class="ptitle" data-i18n="slice">Сечение</div><canvas id="cSlice"></canvas></div>
      <div class="pane side"><div class="ptitle" data-i18n="side">Вид сбоку</div><canvas id="cSide"></canvas></div>
    </div>
    <div class="view3d only-3d">
      <div id="v3d"></div>
      <div class="tools3d">
        <label><input id="wire" type="checkbox"> <span data-i18n="wire">Сетка</span></label>
        <button id="reset3d" data-i18n="reset">Сбросить вид</button>
        <span class="hint" data-i18n="hint3d"></span>
      </div>
    </div>
    <aside class="side-panel">
      <h3 data-i18n="dims">Размеры</h3>
      <div id="dims"></div>
      <h3 data-i18n="slices">Сечения</h3>
      <div id="sliceList" class="chips"></div>
      <div class="range"><input id="secRange" type="range" min="0" max="100" step="0.1" value="0"><span id="secVal"></span></div>
    </aside>
  </section>
</main>

<footer class="status">
  <span id="coords"></span>
  <span class="hint design-only" data-i18n="hint2d"></span>
  <span class="spacer"></span>
  <span data-i18n="stage"></span>
  <a href="https://github.com/SVEBA129347/tentacle-shaper" target="_blank" rel="noopener">GitHub · GPL v3</a>
</footer>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/i18n.js"></script>
<script src="js/s3dx.js"></script>
<script src="js/model.js"></script>
<script src="js/views2d.js"></script>
<script src="js/view3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
